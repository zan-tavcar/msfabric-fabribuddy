site_name: FabriBuddy
site_description: A free, open-source Fabric App for Microsoft Fabric and Power BI. Table lineage, the code behind every table, and who can see every report, all inside your own tenant.
site_url: https://zan-tavcar.github.io/msfabric-fabribuddy/
repo_url: https://github.com/zan-tavcar/msfabric-fabribuddy
repo_name: zan-tavcar/msfabric-fabribuddy
copyright: FabriBuddy is free and open source under the MIT licence. Microsoft Fabric and Power BI are trademarks of Microsoft; FabriBuddy is independent and not affiliated with Microsoft.

theme:
  name: material
  custom_dir: overrides
  logo: assets/fabribuddy-mark.svg
  favicon: assets/fabribuddy-mark.svg
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - toc.integrate
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Overview: index.md
  - Your data stays in your tenant: data-stays-in-your-tenant.md
  - Deploy: deploy.md
  - Service principal: service-principal.md
  - The app: app.md
  - Settings: settings.md
  - Update: update.md
  - Data Catalog: data-catalog.md
  - Report Audience: report-audience.md
  - How it works: how-it-works.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  demo_url: https://zan-tavcar.github.io/msfabric-fabribuddy/demo/
  updated: October 2026
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zan-tavcar/msfabric-fabribuddy
