name: Docs and demo

on:
  push:
    branches: [main]
    paths: ["docs/**", "overrides/**", "mkdocs.yml", "app/**", "core/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material==9.6.*"
      - run: mkdocs build --strict
      # The live demo: the app on the Contoso demo data, as a static site at /demo/.
      - run: pip install -e core
      - run: python core/tools/export_local.py app/public/local-chunks.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx vite build --mode preview --base=/msfabric-fabribuddy/demo/ --outDir ../site/demo --emptyOutDir
        working-directory: app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
